<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1C1526">
<title>HealthBuddy — your friendly health nudge companion</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/styles.css">
<link rel="icon" type="image/png" href="/static/favicon.png">
<link rel="manifest" href="/static/manifest.json">
</head>
<body>
<div id="app" class="app-shell">
  <main id="screen" class="screen" tabindex="-1"><!-- views render here --></main>
  <button id="menu-btn" class="menu-btn hidden" aria-label="Open menu"
          aria-controls="tabbar" aria-expanded="false">☰</button>
  <div id="nav-scrim" class="nav-scrim hidden" hidden></div>
  <nav id="tabbar" class="sidenav hidden" aria-label="Main navigation" aria-hidden="true">
    <div class="sidenav-head">
      <img src="/static/logo-badge.png" width="40" height="40" alt="" aria-hidden="true">
      <div><strong>HealthBuddy</strong><p class="muted small" id="nav-user"></p></div>
      <button id="nav-close" class="nav-close" aria-label="Close menu">✕</button>
    </div>
    <button class="tab" data-route="home"><span class="tab-ico">🏠</span><span>Home</span></button>
    <button class="tab" data-route="nudges"><span class="tab-ico">✨</span><span>Nudges</span></button>
    <button class="tab" data-route="play"><span class="tab-ico">🎮</span><span>Play</span></button>
    <button class="tab" data-route="challenges"><span class="tab-ico">🏆</span><span>Challenges</span></button>
    <button class="tab" data-route="profile"><span class="tab-ico">🙂</span><span>Profile</span></button>
  </nav>
  <div id="toast-zone" class="toast-zone" aria-live="polite"></div>
  <div id="modal-zone"></div>
</div>
<script src="/static/providers.js"></script>
<script src="/static/buddy.js"></script>
<script src="/static/app.js"></script>
<script src="/static/features.js"></script>
<script>if("serviceWorker" in navigator) navigator.serviceWorker.register("/sw.js");</script>
</body>
</html>
